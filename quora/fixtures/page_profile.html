echnology-Caltech-1\",\"isSensitive\":false,\"numFollowers\":51455,\"isFollowing\":false,\"name\":\"California Institute of Technology (Caltech)\",\"photoUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-t-56710-100-iielnvqegcgntfltljnolikpruunzjei.jpeg\"},\"cursor\":\"4\",\"id\":\"Tm9kZUVkZ2U6NTY3MTA6NA==\"}]},\"expertiseTopics\":[{\"id\":\"VG9waWNAMDo5ODA=\",\"__typename\":\"Topic\"}],\"numPublicAnswers\":998,\"numProfileQuestions\":1053,\"postsCount\":212,\"combinedProfileFeedConnection\":{\"id\":\"UHJvZmlsZUZlZWRDb25uZWN0aW9uQDA6MzM1OjE=\",\"__typename\":\"ProfileFeedConnection\",\"__isSignupWallBlockedConnection\":\"ProfileFeedConnection\",\"shouldTriggerSignupWall\":false,\"pageInfo\":{\"hasNextPage\":true,\"endCursor\":\"2\"},\"edges\":[{\"id\":\"Tm9kZUVkZ2U6UG9zdC0yNDY4NzY3NjI6MA==\",\"__typename\":\"NodeEdge\",\"node\":{\"post\":{\"id\":\"UG9zdEAwOjI0Njg3Njc2Mg==\",\"contentQtextDocument\":{\"id\":\"UXRleHREb2N1bWVudEAwOmI4Y2JhOGY5ZDZlZTBlZGI1NzdjZDNlZDhhYWExNGM0\",\"legacyJson\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Today is a hard day at Quora. We made the very difficult and painful decision to reduce the size of several teams across the company. The people leaving us are very talented and contributed large amounts to our products and our mission, and we are doing our best to support them as they look for their next roles.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"For our users, I want to share why we are making this change. We operate two products: Quora and Poe. The Quora product is profitable and cash flow positive, but Poe had been funding its growth with support from Quora, and we decided that it was time for Poe to stand on its own financially and fund its own growth. This unfortunately means a smaller team working on Poe, smaller SG&A functions supporting both products, and reorganization across the company.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Our continuing team will remain focused on our mission to grow the world\\u2019s collective intelligence, through Quora, through Poe, and through future products. The world is changing rapidly with the rise of AI, and we see incredible potential to apply it to greatly improve both of our products, while maintaining financial independence for both of them through smaller, more focused teams.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"I want to thank all Quora team members, both continuing and departing. And I want to thank all Quora and Poe users, especially those who contribute to our ecosystems. We will continue to do our best to serve all of you.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"contentEmbedSection\":null},\"__typename\":\"Post\",\"pid\":246876762,\"viewHash\":\"p-246876762_2b1c7013f78b41a00cf54bd166e4da5d\",\"viewerHasAccess\":true,\"isQuestionSummaryPost\":false,\"tribeItem\":{\"__typename\":\"PostTribeItem\",\"id\":\"UG9zdFRyaWJlSXRlbUAwOjIxMTQxMTExOA==\",\"tribe\":{\"isFollowing\":false,\"isSensitive\":false,\"id\":\"VHJpYmVAMDozNTY1\",\"viewerCanModerate\":false,\"producerDirectStatus\":\"never_enrolled\",\"producerBundleStatus\":\"never_enrolled\",\"viewerDirectSubscription\":null,\"nameString\":\"The Quora Blog\",\"tribeId\":3565,\"__typename\":\"Tribe\",\"url\":\"https://quorablog.quora.com\",\"iconUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-ti-3565-100-kxjiekbzcbikngvqqkradwuhjsfdvljj.jpeg\",\"iconRetinaUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-ti-3565-200-kxjiekbzcbikngvqqkradwuhjsfdvljj.jpeg\",\"isDeleted\":false,\"viewerCanUpdateContentAccessOption\":false,\"defaultAccessOption\  through future products. The world is changing rapidly with the rise of AI, and we see incredible potential to apply it to greatly improve both of our products, while maintaining financial independence for both of them through smaller, more focused teams.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"I want to thank all Quora team members, both continuing and departing. And I want to thank all Quora and Poe users, especially those who contribute to our ecosystems. We will continue to do our best to serve all of you.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"authorCanEditPost\":false,\"effectiveAccessOption\":\"free\",\"isMonetizableForNullspace\":false,\"viewerCanDisableComments\":false,\"commentPreference\":\"disabled\",\"viewer\":{\"user\":null,\"defaultAccessOption\":null,\"id\":\"Vmlld2VyQDA6MA==\",\"showJapanShareItems\":false,\"consumerBundleSubscription\":null,\"tribeDirectSubscriptions\":[],\"staticContent\":{\"title\":\"There is help\",\"contentQtextDocument\":{\"legacyJson\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Need Help? Contact a suicide hotline if you need someone to talk to. If you have a friend in need of help, please encourage that person to contact a suicide hotline as well.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Worldwide\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"unordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In general, if you're outside the US, numbers for your country are here: \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"https://befrienders.org/find-support-now/\\\", \\\"modifiers\\\": {\\\"link\\\": {\\\"type\\\": \\\"u e}, {\\\"spans\\\": [{\\\"text\\\": \\\"France\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"unordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Call SOS Help at (33) 01 46 21 46 46\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 1, \\\"quoted\\\": false, \\\"type\\\": \\\"unordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Australia\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"unordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Call Lifeline Australia at 13 11 14\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 1, \\\"quoted\\\": false, \\\"type\\\": \\\"unordered-list\\\", \\\"is_rtl\\\": false}]}\",\"id\":\"UXRleHREb2N1bWVudEAwOmJiODBiZmZkYzRjZGE0YWNlYTY2MTk5YzYwN2Y5ODI0\"},\"staticContentType\":\"suicide_prevention_message\",\"internalUrl\":\"\",\"id\":\"U3RhdGljQ29udGVudEAwOnN1aWNpZGVfcHJldmVudGlvbl9tZXNzYWdl\"}},\"author\":{\"hasCredentials\":true,\"producerBundleStatus\":\"enabled\",\"id\":\"VXNlckAwOjMzNQ==\",\"uid\":335,\"__typename\":\"User\",\"useTranslatedName\":false,\"isMachineAnswerBot\":false,\"names\":[{\"__typename\":\"UserName\",\"id\":\"VXNlck5hbWU6MzM1OkxBVE4=\",\"reverseOrder\":false,\"givenName\":\"Adam\",\"familyName\":\"D'Angelo\",\"scriptCode\":\"LATN\"}],\"adminNames\":[],\"isAnon\":false,\"profileImageUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-335-200-pdwsbcspdxxmgonnabhpqvynvuwyqigr.jpeg\",\"isVerified\":true,\"isAiAccount\":false,\"businessStatus\":null,\"showPremiumProfileBadge\":false,\"consumerBundleActive\":false,\"profileUrl\":\"/profile/Adam-DAngelo\",\"smallProfileImageUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-335-50-pdwsbcspdxxmgonnabhpqvynvuwyqigr.jpeg\"},\"viewerHasBookmarked\":false,\"isNotForReproduction\":false,\"viewerCanDisableImageGallery\":false,\"facebookSharePermalink\":\"https://quorablog.quora.com/Update?ch=1&oid=246876762&share=572b9cd0&target_type=post\",\"twitterShareIntentUrl\":\"https://www.twitter.com/intent/tweet?lang=en&related=quora&text=&url=https%3A%2F%2Fquorablog.quora.com%2FUpdate%3Fch%3D2%26oid%3D246876762%26target_type%3Dpost\",\"lineShareIntentUrl\":\"https://timeline.line.me/social-plugin/share?url=https%3A//quorablog.quora.com/Update%3Fch%3D13%26oid%3D246876762%26share%3D572b9cd0%26target_type%3Dpost\",\"hatenaShareIntentUrl\":\"https://b.hatena.ne.jp/my/add.confirm?url=https%3A//quorablog.quora.com/Update%3Fch%3D14%26oid%3D246876762%26share%3D572b9cd0%26target_type%3Dpost\",\"__isVotable\":\"Post\",\"viewerVoteType\":\"novote\",\"numUpvotes\":273,\"notForReproduction\":false,\"numViews\":45814,\"webSources\":[],\"monetizationIneligibilityReasons\":[],\"isSelectedForDigestClickthroughSurvey\":false,\"creationTime\":1776377397301100,\"hasSuicideTopics\":false,\"updatedTime\":1776377460458687,\"authorTribeUser\":{\"isDirectSubscriber\":false,\"id\":\"VHJpYmVVc2VyQDA6MzU2NTozMzU=\"},\"__isCredentialContainer\":\"Post\",\"authorCredential\":{\"id\":\"TGlmZUV4cGVyaWVuY2VDcmVkZW50aWFsQDA6NjkzMTA=\",\"__typename\":\"LifeExperienceCredential\",\"__isCredential\":\"LifeExperienceCredential\",\"translatedString\":\"Quora CEO\",\"experience\":{\"id\":\"VG9waWNAMDo3ODc=\",\"__typename\":\"Topic\",\"tid\":787,\"name\":\"Quora (product)\"},\"description\":\"Quora CEO\",\"isDefault\":false,\"isBad\":false,\"isEnqueued\":false,\"credentialId\":69310},\"numSocialVoters\":0,\"photoSocialVoters\":[],\"textSocialVoters\":[]},\"id\":\"UG9zdFByb2ZpbGVGZWVkSXRlbUAwOlBvc3QtMjQ2ODc2NzYy\",\"__typename\":\"PostProfileFeedItem\",\"__isCombinedProfileFeedItem\":\"PostProfileFeedItem\"},\"cursor\":\"0\"},{\"id\":\"Tm9kZUVkZ2U6UG9zdC0yMzYyMjQ5MTM6MQ==\",\"__typename\":\"NodeEdge\",\"node\":{\"post\":{\"id\":\"UG9zdEAwOjIzNjIyNDkxMw==\",\"contentQtextDocument\":{\"id\":\"UXRleHREb2N1bWVudEAwOmIwYmU3MjY0MWUwZDY4NGQ3MDY4ODFiNTI2Yjk1ZGVj\",\"legacyJson\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"We set Quora\\u2019s original mission, to share and grow the world\\u2019s knowledge, in 2011, a time when software could not do much more reliably than move information around between people. The first version of Quora did not use machine learning at all, instead relying on users to tag content, tag their interests, and manually filter for questions they could answer.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Over the years, as machine learning became more powerful, we used it to automate this manual work. We automatically suggested topic labels to humans who would approve them, then we automatically labeled them, and eventually we recommended questions and answers directly without following rigid topic boundaries at all. As large language models emerged, we started using them to generate questions, facilitating human answer writing.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In early 2022, we experimented with applying GPT-3 to answering questions. These experiments revealed that LLMs could be very useful in private, whereas Quora content was all public. We also realized that people could often collaborate most effectively with LLMs through a chat interface. So, we created Poe, a product for people to chat with all kinds of LLMs in private.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Today Poe lets millions of people access knowledge and intelligence from all kinds of AI, including text, reasoning, image, video, and audio models. People use it for very diverse tasks: they ask questions, they get help with their writing, they generate multimedia, and they create entire applications. While some people are looking for knowledge, as the models get smarter and smarter, people want their advice, their collaboration, and more generally, their intelligence.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Quora\\u2019s public format and Poe\\u2019s private focus make them complementary in serving a wide spectrum of needs, but they function similarly: they both let people access knowledge and intelligence that helps them understand and affect the world. They both aggregate knowledge and intelligence from many sources. They both focus on sharing what exists, rather than creating knowledge like a researcher would or creating AI like an AI lab would. They are platforms, and as we build them we inherently focus on the most leveraged aspect of creating public goods: removing friction and unlocking the potential in what everyone else has already learned, created, or trained.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"By sharing all this knowledge and intelligence, we help individuals, but we also hope to help society as a whole. The more we enable collaborative thinking between humans, and between humans and AI, the faster ideas will diffuse, the faster technology will advance, and the faster the economy will grow. Our ultimate goal is at this higher level: the ability for humanity as a whole, along with all artificial intelligence, to share knowledge, create technology, and work together to solve problems. We describe this as \\u201ccollective intelligence\\u201d. This is our new, expanded mission: to grow the world\\u2019s collective intelligence.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}]}\",\"contentEmbedSection\":null},\"__typename\":\"Post\",\"pid\":236224913,\"viewHash\":\"p-236224913 ke Kominers. Winners will receive awards from a prize pool of $3,750. Submissions accepted through August 26, 2024.\\\\n\\\\n\\\\nHow to Participate\\\\n\\\\n1. Select a question:\\\\nChoose one or more of the following questions:\\\\n2. \\\\n1. How should one reason about which type of market-clearing mechanism to use when?\\\\n2. Should the design of economic policy and market institutions respond to inequality? If so, how?\\\\n3. What's a counterintuitive result of economics logic that nonetheless rings true?\\\\n\\\\n3. Write your answer:\\\\nYour answer should stand out for its quality of analysis, as well as originality, clarity, and relevance.\\\\n4. Submit your entry:\\\\nSubmit the link to your Quora answer along with your contact information and necessary legal agreements via this Google form.\\\\n\\\\nPrizes and Recognition\\\\n\\\\n * For each question:\\\\n * \\\\n * Gold Prize: $1,000\\\\n * Silver Prize: $200\\\\n * Bronze Prize: $50\\\\n\\\\n * Special recognition: A distinguished award badge will be displayed on winners\\u2019 Quora profiles.\\\\n\\\\nMeet the Judge\\\\n\\\\nYour submissions will be evaluated by economist Scott Duke Kominers:\\\\n\\\\n * Sarofim-Rock Professor of Business Administration at Harvard Business School\\\\n * Faculty Affiliate of the Harvard Department of Economics and the Harvard Center of Mathematical Sciences and Applications\\\\n * a16z crypto Research Partner\\\\n * Quora Economist\\\\n * Read more on Scott\\u2019s Quora Profile here: Scott Duke Kominers\\\\nJudging:\\\\n\\\\n * Answers will be judged based on quality of analysis, as well as originality, clarity, and relevance. Submissions will be anonymized prior to judging.\\\\n\\\\nImportant Dates\\\\n\\\\n * Contest opens: August 16, 2024, at 10:00 AM PT\\\\n * Contest closes: August 26, 2024, at 11:59 PM PT\\\\n * Winners announced via email in September 2024\\\\n\\\\nEligibility\\\\n\\\\n * Eligible countries: Only residents of US, Germany, Japan, Italy, Spain,
