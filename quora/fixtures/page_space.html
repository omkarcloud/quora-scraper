VXNlck5hbWU6MTM0MzM5Njc3NjpMQVRO\",\"reverseOrder\":false,\"givenName\":\"Pusp L.\",\"familyName\":\"\",\"scriptCode\":\"LATN\"}],\"adminNames\":[]},\"canInviteAuthorToTribe\":false,\"isTribeItemMonetizable\":true,\"isTribeItemPinned\":false,\"containsDifferentExistingPin\":true,\"viewerInvitedAuthorToTribe\":false,\"submission\":null,\"authorPermission\":3},\"__isReportable\":\"Post\",\"__typename\":\"Post\",\"reportableId\":258281508,\"canViewerReport\":false,\"network\":{\"appealsFormUrl\":\"https://help.quora.com/hc/en/requests/new?ticket_form_id=198746\",\"id\":\"TmV0d29yazow\"},\"author\":{\"viewerIsFollowing\":false,\"id\":\"VXNlckAwOjEzNDMzOTY3NzY=\",\"__typename\":\"User\",\"uid\":1343396776,\"viewerHasMuted\":false,\"useTranslatedName\":false,\"isMachineAnswerBot\":false,\"names\":[{\"__typename\":\"UserName\",\"id\":\"VXNlck5hbWU6MTM0MzM5Njc3NjpMQVRO\",\"reverseOrder\":false,\"givenName\":\"Pusp L.\",\"familyName\":\"\",\"scriptCode\":\"LATN\"}],\"adminNames\":[],\"isBlocking\":false,\"isBlockedByViewer\":false,\"followerCount\":2102,\"viewerIsFollowedBy\":false,\"hasCredentials\":true,\"producerBundleStatus\":\"never_enrolled\",\"isAnon\":false,\"profileImageUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-1343396776-200-vsrjwjxddyidpkwwigapzfnsqlbhaevh.jpeg\",\"isVerified\":false,\"isAiAccount\":false,\"businessStatus\":null,\"showPremiumProfileBadge\":false,\"consumerBundleActive\":false,\"profileUrl\":\"https://www.quora.com/profile/Pusp-L\",\"smallProfileImageUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-1343396776-50-vsrjwjxddyidpkwwigapzfnsqlbhaevh.jpeg\"},\"tribe\":{\"isFollowing\":false,\"id\":\"VHJpYmVAMDoxNTc1MTk0\",\"__typename\":\"Tribe\",\"tribeId\":1575194,\"viewerCanContribute\":false,\"viewerCanAdmin\":false,\"viewerPermission\":null,\"isMuted\":false,\"viewerIsBlockedByTribe\":false,\"viewerIsOnlyAdmin\":false,\"owner\":null,\"viewerDirectSubscription\":null,\"producerDirectStatus\":\"disabled\",\"nameString\":\"Humanity\",\"numFollowers\":331951,\"tribeUserCount\":332676,\"producerBundleStatus\":\"enabled\",\"directSubscriptionYearlyPriceDollar\":10.0,\"directSubscriptionMonthlyPriceDollar\":1.0,\"viewerHasGiftSubscriptionInvite\":false,\"viewerPendingInvitesToTribe\":[]},\"__isVotable\":\"Post\",\"oid\":258281508,\"contentType\":\"post\",\"numUpvotes\":454,\"pid\":258281508,\"contentQtextDocument\":{\"legacyJson\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"\\\", \\\"modifiers\\\": {\\\"image\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-b81b04a4d697e5211e86073f4592d832\\\", \\\"height\\\": 535, \\\"width\\\": 932, \\\"master_url\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-f04557b22d91ae617c09b867dfbddd77\\\", \\\"is_deleted\\\": false, \\\"is_sensitive\\\": false, \\\"is_uploaded_by_bot\\\": false, \\\"zoomable\\\": true, \\\"dominant_color\\\": \\\"#212020\\\", \\\"has_transparency\\\": false}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"image\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In July 2015, Richard Berry, the mayor of Albuquerque, was driving back to City Hall from lunch when he saw a man on a street corner holding a cardboard sign. It read, \\u201cWant a Job. Anything Helps.\\u201d Berry went to his staff and said the city should take that man at his word.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"By September, the city had pulled an old Dodge van from its motor pool, put new tires on it, and wrapped it with the words There\\u2019s a Better Way. St. Martin\\u2019s Hospitality Center, Albuquerque\\u2019s largest homeless shelter, ran the program. Two mornings a week, a driver named Will Cole took the van to the street corners where people were asking for money.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"On one windy March morning in 2016, people stood outside St. Martin\\u2019s waiting for Cole and his van. At each stop he got out and fist-bumped everyone who climbed in. He told them \\u201cgood morning, ma\\u2019am\\u201d or \\u201csir,\\u201d and he loaded their bags into the back himself.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"One man he stopped for was Fidel, who said he was from Cuba. Cole asked if he wanted to work that day. Then he told Fidel he looked cold. Fidel said he had slept in the street the night before. Cole asked if that was every night, and Fidel said yes. Fidel got in the van.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The crews picked up litter and pulled weeds for the city\\u2019s Solid Waste Management Department. The shift lasted five hours. Workers got breakfast and lunch, and at lunchtime staff from city behavioral health departments came out to talk with them. Each person was paid $9 an hour in cash, which came to $45. The state minimum wage was $7.50. Berry said it was hard work, with shovels and rakes in the hot sun. A worker named John told PBS the job gave him \\u201ca sense of accomplishment,\\u201d and he wished it ran more days. Cole said that if he owned a business, he would hire many of these people in a second.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"At the end of the day, the van took everyone back to St. Martin\\u2019s. Staff there helped with housing, job searches and health care. Kellie Tillerson of St. Martin\\u2019s said many workers had not known those services existed. One man who had just left prison came back the next day. St. Martin\\u2019s signed him up for its day labor program, told him about behavioral health services, and began helping him get an ID.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"After three years, the city counted 6,666 one-day jobs held by 1,575 workers. Seventy-six of them had found permanent work. Seattle started a program modeled on Albuquerque\\u2019s. The city ended the original program in 2020, and a new version called Better Way Forward began in 2024.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In May 2016, KRQE rode along on one of the van\\u2019s mornings. Thomas Trusley, 68, said he had been a shop mechanic until a layoff left him homeless a year and a half earlier. His first goal was permanent work. With that day\\u2019s pay, he planned to buy shaving gear and cologne so he would look presentable. He had no jacket, but he had a clean shirt, and he called it his \\u201cSunday dos.\\u201d\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"\\\", \\\"modifiers\\\": {\\\"image\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-632f7e4c278b3ad86b06dd42167112c7\\\", \\\"height\\\": 413, \\\"width\\\": 720, \\\"master_url\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-59bfc151481b7d8bb1a8217d6b0fe5ab\\\", \\\"is_deleted\\\": false, \\\"is_sensitive\\\": false, \\\"is_uploaded_by_bot\\\": false, \\\"zoomable\\\": true, \\\"dominant_color\\\": \\\"#9fab97\\\", \\\"has_transparency\\\": false}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"image\\\", \\\"is_rtl\\\": false}]}\",\"id\":\"UXRleHREb2N1bWVudEAwOjg4NTQzMmIzODBjNDU1N2FhOGU2MjRlZmY4OTgwMzgx\",\"contentEmbedSection\":null},\"isQuestionSummaryPost\":false,\"viewHash\":\"p-258281508_c87 irsrrsxwgmmopu.jpeg\",\"isVerified\":false,\"isAiAccount\":false,\"businessStatus\":null,\"showPremiumProfileBadge\":false,\"consumerBundleActive\":false,\"profileUrl\":\"https://www.quora.com/profile/Sri-A-77\",\"smallProfileImageUrl\":\"https://qph.cf2.quoracdn.net/main-thumb-1343023701-50-sgacpxfiqfuzpgjzufirsrrsxwgmmopu.jpeg\"},\"tribe\":{\"isFollowing\":false,\"id\":\"VHJpYmVAMDoxNTc1MTk0\",\"__typename\":\"Tribe\",\"tribeId\":1575194,\"viewerCanContribute\":false,\"viewerCanAdmin\":false,\"viewerPermission\":null,\"isMuted\":false,\"viewerIsBlockedByTribe\":false,\"viewerIsOnlyAdmin\":false,\"owner\":null,\"viewerDirectSubscription\":null,\"producerDirectStatus\":\"disabled\",\"nameString\":\"Humanity\",\"numFollowers\":331951,\"tribeUserCount\":332676,\"producerBundleStatus\":\"enabled\",\"directSubscriptionYearlyPriceDollar\":10.0,\"directSubscriptionMonthlyPriceDollar\":1.0,\"viewerHasGiftSubscriptionInvite\":false,\"viewerPendingInvitesToTribe\":[]},\"__isVotable\":\"Post\",\"oid\":258269169,\"contentType\":\"post\",\"numUpvotes\":479,\"pid\":258269169,\"contentQtextDocument\":{\"legacyJson\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"\\\", \\\"modifiers\\\": {\\\"image\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-1e90991e5cbec437d646aa56553e8511\\\", \\\"height\\\": 657, \\\"width\\\": 876, \\\"master_url\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-f0b664df81dee0ff6d3fc957fd6ec740\\\", \\\"is_deleted\\\": false, \\\"is_sensitive\\\": false, \\\"is_uploaded_by_bot\\\": false, \\\"zoomable\\\": true, \\\"dominant_color\\\": \\\"#222120\\\", \\\"has_transparency\\\": false}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"image\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan Bower was finishing at the pump at a Circle K in Do\\u00f1a Ana, New Mexico, around nine on the morning of March 25, 2020, when he heard a woman screaming across the street. He was 16. He saw a man pulling children away from their mother and hitting people who tried to help.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The woman had just stepped off a Greyhound bus at Chucky\\u2019s convenience store with her three children, who were 9, 2 and 1. They were waiting for an Uber. A stranger had been staring at her. Then he grabbed her 2-year-old and told her to give him the children. According to court documents, she fell onto her back, where her 1-year-old was strapped in a carrier.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Bystanders ran to help, and the man punched some of them. The mother got her children into the store and behind an office door. The man followed and tried to break the door open.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan\\u2019s father, Troy Bower, said his son jumped in his truck and drove across the street. \\u201cBy the time he got there, they had gone inside.\\u201d\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan went in after them. He was a 285-pound heavyweight who had won his district wrestling title on February 16. He pulled the man away from the office door and took him to the floor. He told his father he body-slammed the man and held him in a chokehold.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"He held him there for several minutes, court documents say. Then Deputy Jessie Espana came in and found two men on the floor and a room full of frightened people. Deputies arrested Daniel Arroyo Beltran, 22, of Phoenix. He was charged with kidnapping, child abuse, battery and assault. No report showed that he knew the mother or her children.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The Do\\u00f1a Ana County Sheriff\\u2019s Office said that without Canaan\\u2019s quick response, the outcome may have been very different.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Troy Bower said he feared for his son\\u2019s safety. Nobody knew if the man had a knife or a gun. But he said he was sure Canaan would do the right thing.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan\\u2019s coach, Bill Hawkins, called him that same day and asked what was going on. \\u201cNot much,\\u201d Canaan said. Then he told the whole story in a calm, flat voice, as if it were any other day. Canaan told his father, \\u201cDad, that woman and her kids needed help. I\\u2019m not a hero.\\u201d\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"On April 14, 2020, the Do\\u00f1a Ana County commissioners voted unanimously to proclaim Canaan Bower Day of Valor. Troy Bower stood up and said, \\u201cThank you for recognizing my son.\\u201d He said the act was typical of Canaan. When Canaan was 10, he saved money for a year to buy an iPod. By the time he had enough, he changed his mind and gave all of it to a charity that provides food and shelter for people in need.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan graduated from Mayfield High School. On March 9, 2022, around 8:30 in the evening, he was riding his motorcycle south on South Triviz Drive in Las Cruces. It collided with a car turning onto the road. He died at the scene. He was 18.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"His father told reporters that Canaan hated the attention from the start. \\u201cHe despised it from day one.\\u201d Troy and his wife, Kara, said they did not want their son remembered only for one act. They wanted people to remember how he made the people around him better. His teammates planned a vigil at Mayfield High School.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Kara Bower said her son believed people would do good things if you asked them to. \\u201cHe always saw good in whoever.\\u201d\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"\\\", \\\"modifiers\\\": {\\\"embed\\\": {\\\"url\\\": \\\"https://www.youtube.com/watch?v=TJvMLcf4Dfk\\\"}}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"yt-embed\\\", \\\"is_rtl\\\": false}]}\",\"id\":\"UXRleHREb2N1bWVudEAwOjc5ZTIzOWIzMTdmODQ0N2M4ZDJiMjdiMjM2MDZlNmQ1\",\"contentEmbedSection\":null},\"isQuestionSummaryPost\":false,\"viewHash\":\"p-258269169_b25d7f29a0eb83bedd3faf31042c5f9e\",\"url\":\"https://humanity.quora.com/When-danger-struck-16-year-old-wrestler-Canaan-Bower-didnt-hesitate-to-protect-a-mother-and-her-children-His-courage\",\"title\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"When danger struck, 16-year-old wrestler Canaan Bower didn't hesitate to protect a mother and her children. His courage, quiet humility, and constant kindness showed us what true hea ff a Greyhound bus at Chucky\\\\u2019s convenience store with her three children, who were 9, 2 and 1. They were waiting for an Uber. A stranger had been staring at her. Then he grabbed her 2-year-old and told her to give him the children. According to court documents, she fell onto her back, where her 1-year-old was strapped in a carrier.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Bystanders ran to help, and the man punched some of them. The mother got her children into the store and behind an office door. The man followed and tried to break the door open.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan\\\\u2019s father, Troy Bower, said his son jumped in his truck and drove across the street. \\\\u201cBy the time he got there, they had gone inside.\\\\u201d\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan went in after them. He was a 285-pound heavyweight who had won his district wrestling title on February 16. He pulled the man away from the office door and took him to the floor. He told his father he body-slammed the man and held him in a chokehold.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"He held him there for several minutes, court documents say. Then Deputy Jessie Espana came in and found two men on the floor and a room full of frightened people. Deputies arrested Daniel Arroyo Beltran, 22, of Phoenix. He was charged with kidnapping, child abuse, battery and assault. No report showed that he knew the mother or her children.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The Do\\\\u00f1a Ana County Sheriff\\\\u2019s Office said that without Canaan\\\\u2019s quick response, the outcome may have been very different.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Troy Bower said he feared for his son\\\\u2019s safety. Nobody knew if the man had a knife or a gun. But he said he was sure Canaan would do the right thing.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan\\\\u2019s coach, Bill Hawkins, called him that same day and asked what was going on. \\\\u201cNot much,\\\\u201d Canaan said. Then he told the whole story in a calm, flat voice, as if it were any other day. Canaan told his father, \\\\u201cDad, that woman and her kids needed help. I\\\\u2019m not a hero.\\\\u201d\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"On April 14, 2020, the Do\\\\u00f1a Ana County commissioners voted unanimously to proclaim Canaan Bower Day of Valor. Troy Bower stood up and said, \\\\u201cThank you for recognizing my son.\\\\u201d He said the act was typical of Canaan. When Canaan was 10, he saved money for a year to buy an iPod. By the time he had enough, he changed his mind and gave all of it to a charity that provides food and shelter for people in need.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Canaan graduated from Mayfield High School. On March 9, 2022, around 8:30 in the evening, he was riding his motorcycle south on South Triviz Drive in Las Cruces. It collided with a car turning onto the road. He died at the scene. He was 18.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"His father told reporters that Canaan hated the attention from the start. \\\\u201cHe despised it from day one.\\\\u201d Troy and his wife, Kara, said they did not want their son remembered only for one act. They wanted people to remember how he made the people around him better. His teammates planned a vigil at Mayfield High School.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Kara Bower said her son believed people would do good things if you asked them to. \\\\u201cHe always saw good in whoever.\\\\u201d\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"\\\", \\\"modifiers\\\": {\\\"embed\\\": {\\\"url\\\": \\\"https://www.youtube.com/watch?v=TJvMLcf4Dfk\\\"}}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"yt-embed\\\", \\\"is_rtl\\\": false}]}\",\"authorCanEditPost\":false,\"effectiveAccessOption\":\"smart_distribution\",\"isMonetizableForNullspace\":false,\"viewerCanDisableComments\":false,\"commentPreference\":\"enabled\",\"viewer\":{\"user\":null,\"defaultAccessOption\":null,\"id\":\"Vmlld2VyQDA6MA==\",\"showJapanShareItems\":false,\"consumerBundleSubscription\":null,\"tribeDirectSubscriptions\":[],\"staticContent\":{\"title\":\"There is help\",\"contentQtextDocument\":{\"legacyJson\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Need Help? Contact a suicide hotline if you need someone to talk to. If you have a friend in need of help, please encourage that person to contact a suicide hotline as well.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": f
