net/main-qimg-25946ab4b99b3a3a1b7f379a8f41ffe0\",\"id\":\"QWRMb2dvQDA6MTczNDQ3\"},\"isSelectedForFeedSurvey\":false,\"isSelectedForQuestionPageSurvey\":false,\"viewerHasRepliedToSurvey\":false,\"canonicalAd\":{\"viewerHasRepliedToSurvey\":false,\"id\":\"VGV4dE9ySW1hZ2VBZEAwOjIxMTEwNjI0MzAzMzQ4OA==\",\"numUpvotes\":95},\"numUpvotes\":95,\"leadgenFormId\":null,\"logoImageUrl\":\"https://qph.cf2.quoracdn.net/main-qimg-25946ab4b99b3a3a1b7f379a8f41ffe0\",\"streamType\":\"efficient_gcn_targeting\"},\"id\":\"UXVlc3Rpb25BZEl0ZW1AMDo4MzE3MzMzNTphZDoyMTExMDYyNDMwMzM0ODgtMTo1MjkxNDgwODU5Mzk1OTE3MTZ8MjExMTA2MjQzMDMzNDg4fDA=\"},{\"adLocation\":\"inline_question\",\"ad\":{\"answer\":{\"id\":\"QW5zd2VyQDA6MTQ3Nzc0MzkyMjQ0MDQwNw==\",\"viewHash\":\"a-1477743922440407_87e3648bbdca445e6a2dd0bca8bfe2b6\",\"aid\":1477743922440407,\"__typename\":\"Answer\",\"content\":\"{\\\"sections\\\": [{\\\"spans\\\": [{\\\"text\\\": \\\"Who, Besides Neanderthals and Denisovans, Left a Trace in Our DNA?\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Searching for a third ancient relative that interbred with Homo sapiens after our species had already emerged\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Today, only one species of the genus \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" lives on Earth: \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\". But for most of its history, our species shared the planet with other members of the genus. We know that our ancestors interbred with Neanderthals and Denisovans, and that some of their genes survive in us. Were they the only ones?\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"To answer this, we must distinguish two questions. The first asks which ancestors Homo sapiens evolved from. The second is which groups it interbred with later, after it had emerged as a species. The first concerns our roots; the second, later admixture. We are interested in the second.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"A few words about terminology. By \\\\u201cspecies,\\\\u201d we mean formally described groups such as \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo erectus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" or \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo floresiensis\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\". By \\\\u201clineage,\\\\u201d we mean any distinct branch of the genus \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", including Denisovans, who have not yet been formally described as a separate species. By \\\\u201cpopulation,\\\\u201d we mean a particular group within a species or lineage.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"1. The Origins of \\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"bold\\\": true, \\\"italic\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The genus \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" arose in Africa more than two million years ago. The exact chain of species leading to us has not been established: the evolution of the genus resembles a bush more than a ladder.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"\\\", \\\"modifiers\\\": {\\\"image\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-dc11b6836732166d48dda17333f98d65\\\", \\\"height\\\": 312, \\\"width\\\": 702, \\\"master_url\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-ef84432462ee74a7c8cf641eb8f96bf0\\\", \\\"is_deleted\\\": false, \\\"is_sensitive\\\": false, \\\"is_uploaded_by_bot\\\": false, \\\"zoomable\\\": true, \\\"dominant_color\\\": \\\"#f9fafb\\\", \\\"has_transparency\\\": false}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"image\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"This sequence is schematic: we cannot claim that each species in the table evolved directly from the one before it.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The oldest known \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" remains were found at Jebel Irhoud in Morocco and are about 315,000 years old. But our species did not emerge at a single location. According to a genetic model published in 2025, the ancestry of \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" was shaped by two African populations. They diverged about 1.5 million years ago and came together again roughly 300,000 years ago, contributing in a ratio of about 80 to 20. If the model is confirmed, it will mean that the formation of our genome involved the merging of two ancient lineages. But this does not mean that our species emerged at that very time and because of that event.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"So \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" already existed around 300,000 years ago. But it was not alone.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"2. Who Lived Alongside Us\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"\\\", \\\"modifiers\\\": {\\\"image\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-41e1e4eafdb9f54b98e87cf8cadc9ae3\\\", \\\"height\\\": 372, \\\"width\\\": 646, \\\"master_url\\\": \\\"https://qph.cf2.quoracdn.net/main-qimg-617ecbe7378d6145fe7f7318153408b4\\\", \\\"is_deleted\\\": false, \\\"is_sensitive\\\": false, \\\"is_uploaded_by_bot\\\": false, \\\"zoomable\\\": true, \\\"dominant_color\\\": \\\"#f8f9fb\\\", \\\"has_transparency\\\": false}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"image\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"These dates reflect the ages of known finds, not necessarily the times of extinction. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo naledi\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" lived in South Africa, probably at the same time as early \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", but there is no evidence of contact between them.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"After \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" emerged, at least five other known lineages of the genus \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" continued to exist on Earth, although their histories overlapped with ours to varying degrees. Some survived until around 50,000 years ago. But coexistence does not imply an encounter, and an encounter does not imply interbreeding. We must therefore distinguish what is confirmed from what is proposed.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"3. Two Confirmed Cases\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Neanderthals\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Neanderthals diverged as a distinct lineage long before sapiens left Africa, and inhabited Europe and Western Asia. According to studies published in 2024, the main episode of admixture with sapiens who had left Africa and were the ancestors of all present-day non-Africans lasted about seven thousand years, roughly 50,000\\\\u201343,000 years ago. By then, our species had already existed for about a quarter of a million years. This was therefore not a matter of descent from Neanderthals, but an encounter between two lineages that had diverged long before.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Today, about 1\\\\u20132% of the genome of non-Africans is of Neanderthal origin. Across Africa, the picture varies. North African populations have the highest levels of Neanderthal DNA: in some groups, the proportion is roughly the same as in Eurasians. Noticeable traces are also found in the Horn of Africa, in Ethiopia and Somalia. Elsewhere south of the Sahara, the proportion is much smaller: in 2020, researchers detected an average of about 0.3% apparent Neanderthal ancestry in West and East African populations, while almost no Neanderthal admixture has been detected in hunter-gatherer populations in Central and Southern Africa. Most of these traces were brought by migrations from Eurasia back into Africa. But part of the signal has a different explanation: it comes from DNA of early sapiens that entered Neanderthal genomes long ago and now appears \\\\u201cNeanderthal\\\\u201d (more on this below).\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Genetic material also flowed in the opposite direction. Apparently, more than 200,000 years ago, early sapiens or members of a closely related lineage had already interbred with Neanderthals after leaving Africa long before the main migration wave. The mitochondrial DNA (inherited through the maternal line) and Y chromosome (through the paternal line) of late Neanderthals appear to trace back to these encounters. Gene exchange thus went both ways: a part of early sapiens lived on in late Neanderthals, and a part of Neanderthals still lives on in us, even though they themselves disappeared around 40,000 years ago.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Denisovans\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In 2010, DNA from a finger bone found in Denisova Cave in the Altai Mountains revealed a lineage whose existence no one had suspected. Denisovans proved to be close relatives of Neanderthals, but a separate branch.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"For a long time, we knew them almost entirely through their genes. In 2025, analyses of ancient proteins and mitochondrial DNA from the Harbin skull in China, at least 146,000 years old and previously described as \\\\u201c\\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo longi\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\",\\\\u201d convincingly linked it to the Denisovan lineage: two independent kinds of molecular evidence converged on the same conclusion. For the first time, we have a fairly complete Denisovan skull, and with it a chance to picture what these ancient relatives looked like.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Denisovan ancestry is most pronounced among the peoples of Oceania and the Aeta of the Philippines, accounting for up to several percent of the genome; among Papuans, the figure is about 3\\\\u20135%. Geneticists distinguish at least three episodes of admixture involving different and markedly distinct Denisovan populations. These were all cases of admixture with Denisovans, not with a third lineage, but they show how often such encounters took place.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The ancient lineages also interbred with one another. A bone found in Denisova Cave belonged to a girl whose mother was a Neanderthal and whose father was a Denisovan.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Thus, two cases are confirmed: \\\", \\\"modifiers\\\": {\\\"bold\\\": true}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"bold\\\": true, \\\"italic\\\": true}}, {\\\"text\\\": \\\" interbred with Neanderthals and Denisovans after it had already emerged as a species. The question is whether there was a third.\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"4. Candidates for a Third Lineage\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Here it is important to distinguish three levels. The first is direct admixture between our ancestors and an unknown lineage. The second is an indirect trace: genes from a third lineage may have reached us through an intermediary. The third concerns known fossil species with which encounters were possible, but for which no genetic traces have been found. Strictly speaking, only the first level answers the question in the title.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Direct admixture: Africa's \\\\u201cghost populations\\\\u201d\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Geneticists find patterns in our genomes that some models explain as admixture with unknown ancient groups. These are called \\\\u201cghost populations\\\\u201d because they cannot be linked to any fossil find.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"In 2020, geneticists Arun Durvasula and Sriram Sankararaman proposed a model in which 2 to 19% of the genetic ancestry of certain West African peoples could have come from an unknown archaic lineage that diverged earlier than Neanderthals. These estimates depend on the model adopted and have not yet been confirmed by ancient DNA. Their model's central estimate for the timing of admixture is around 43,000 years ago, although the possible range is enormous: roughly 6,000 to 124,000 years ago. If the model is correct, the admixture occurred long after \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" emerged, precisely the kind of case we are looking for.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"A 2023 study led by Aaron Ragsdale offered a different explanation for the same signals. In this model, the ancestors of \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" lived for hundreds of thousands of years in several loosely connected groups that sometimes separated and then mixed again. This model shows that such signals do not necessarily imply interbreeding with a separate, unknown lineage. But it does not prove that no such lineage existed.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The debate remains unresolved. Ancient DNA rarely survives in Africa's hot climate, and testing the models against direct evidence is not yet possible.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"An indirect trace from a super-archaic lineage, a third source of genes but not a third interbreeding partner\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Genetic analysis points to admixture with an even older lineage in the Denisovan genome; according to one model, such admixture was already present in the common ancestors of Neanderthals and Denisovans. This older lineage probably diverged from the common ancestral lineage around two million years ago or even earlier. Its identity is unknown; Asian Homo erectus is among the possible candidates.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Denisovans later interbred with our ancestors, so a small share of this ancient ancestry may also have reached present-day Papuans. But this is not evidence that Homo sapiens encountered a third lineage: it was Denisovans who interbred with it, not us.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Thus, a third ancient lineage may have left an indirect trace in our genome. But if we are looking for a third case of direct interbreeding with \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", Africa is the first place to look for an answer.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Possible encounters with late Homo erectus, Homo floresiensis, and Homo luzonensis\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"All three lineages lived in Southeast Asia when our ancestors were arriving in the region or would soon do so. Late \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo erectus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" on Java survived until around 110,000 years ago, \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo floresiensis\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" until roughly 60,000\\\\u201350,000 years ago, and \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo luzonensis\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" until at least 50,000\\\\u201367,000 years ago.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Encounters with \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" were possible, especially for \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo floresiensis\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\". But DNA has not been recovered from any of these finds. And searches for unidentified archaic signals in the genomes of present-day inhabitants of Indonesia and the Philippines have so far revealed only Denisovan ancestry. None of these three lineages can be regarded as a confirmed interbreeding partner of our species.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"5. Why We Still Have No Answer\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"The Denisovan story shows how incomplete our knowledge is. An entire lineage of the genus Homo was discovered through a tiny fragment of bone, and a fairly complete skull was first linked to this lineage only 15 years later.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Many regions of Africa and South Asia remain poorly studied. In hot, humid climates, ancient DNA breaks down quickly, so researchers there have to rely on ancient proteins, which survive longer but carry less information.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Perhaps new methods will reveal a genetic trace of late \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo erectus\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\". Perhaps the remains of an entirely unknown lineage will be found. Or perhaps some \\\\u201cghost populations\\\\u201d will turn out to be simply the complex internal history of \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" itself.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"6. Conclusion\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"After \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" emerged, other lineages of the genus \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" continued to live on Earth for hundreds of thousands of years. Our ancestors are known to have interbred with two of them: Neanderthals and Denisovans.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"But the genetic history of our species may have been much more complex. Research allows for both indirect inheritance from an even older lineage through Denisovans and direct admixture with unknown African populations after \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Homo sapiens\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\" had already emerged.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"None of these proposed lineages can yet be confidently identified as a third confirmed interbreeding partner of our species. But the genetic signals themselves give us strong grounds to continue the search.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"We know that Neanderthals and Denisovans left a trace in our DNA. But do we know everyone who did? Perhaps the most interesting discoveries still lie ahead.\\\\n \\\\n \\\\n Key References\\\", \\\"modifiers\\\": {\\\"bold\\\": true}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"plain\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Durvasula A., Sankararaman S. Recovering signals of ghost archaic introgression in African populations. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Science Advances\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", 2020.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"ordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Ragsdale A. P. et al. A weakly structured stem for human origins in Africa. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Nature\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", 2023.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"ordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Rogers A. R., Harris N. S., Achenbach A. A. Neanderthal-Denisovan ancestors interbred with a distantly related hominin. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Science Advances\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", 2020.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"ordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Iasi L. N. M. et al. Neanderthal ancestry through time: Insights from genomes of ancient and present-day humans. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Science\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", 2024.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"ordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Cousins T., Scally A., Durbin R. A structured coalescent model reveals deep ancestral structure shared by all modern humans. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Nature Genetics\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", 2025.\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"ordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Fu Q. et al. The proteome of the late Middle Pleistocene Harbin individual. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Science\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", 2025. doi:10.1126/science.adu9677\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"ordered-list\\\", \\\"is_rtl\\\": false}, {\\\"spans\\\": [{\\\"text\\\": \\\"Fu Q. et al. Denisovan mitochondrial DNA from dental calculus of the >146,000-year-old Harbin cranium. \\\", \\\"modifiers\\\": {}}, {\\\"text\\\": \\\"Cell\\\", \\\"modifiers\\\": {\\\"italic\\\": true}}, {\\\"text\\\": \\\", 2025. doi:10.1016/j.cell.2025.05.040\\\", \\\"modifiers\\\": {}}], \\\"indent\\\": 0, \\\"quoted\\\": false, \\\"type\\\": \\\"orde
